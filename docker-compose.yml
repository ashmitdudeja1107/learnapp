version: '3.8'

services:
  web:
    image: tiangolo/uvicorn-gunicorn-fastapi:python3.10
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      /bin/bash -c "
      pip install -r requirements.txt &&
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - LLM_HOST=http://ollama:11434  # Passed into your app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # ❗️Note: You must manually run this ONCE after `up`:
    # docker compose exec ollama ollama pull llama3

volumes:
  redis_data:
  ollama_data:
